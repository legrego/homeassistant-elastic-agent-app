name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  app:
    name: Home Assistant app lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant app lint
        uses: frenck/action-addon-linter@v2.21.2
        with:
          path: "./elastic_agent"

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:latest-debian hadolint elastic_agent/Dockerfile

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: shellcheck elastic_agent/rootfs/usr/local/bin/ha-entrypoint tests/smoke/smoke.sh
