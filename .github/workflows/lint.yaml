name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  app:
    name: Home Assistant app lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Home Assistant app lint
        uses: frenck/action-addon-linter@v2.21.2
        with:
          path: "./elastic_agent"

  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint the Dockerfile
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:latest-debian hadolint elastic_agent/Dockerfile

  status:
    name: Status page (Go)
    runs-on: ubuntu-latest
    # Keep in step with the golang image in elastic_agent/Dockerfile.
    container: golang:1.27.3
    defaults:
      run:
        working-directory: elastic_agent/status
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint shell scripts
        run: shellcheck elastic_agent/rootfs/usr/local/bin/ha-entrypoint elastic_agent/rootfs/usr/local/bin/ha-elasticsearch-setup tests/smoke/smoke.sh .github/scripts/release-notes

  changelog:
    name: Changelog entry
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The release job uses this section as the release notes.
      - name: Check the changelog has an entry for the app version
        run: .github/scripts/release-notes "$(yq '.version' elastic_agent/config.yaml)" > /dev/null
