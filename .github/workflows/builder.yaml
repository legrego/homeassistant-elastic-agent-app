name: Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - "elastic_agent/**"
      - "tests/**"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/build-app.yaml"
  push:
    branches:
      - main
    paths:
      - "elastic_agent/**"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/build-app.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build elastic_agent
    needs: smoke
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: elastic_agent
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run the smoke test
        run: tests/smoke/smoke.sh
