name: Builder

on:
  pull_request:
    branches:
      - main
    paths:
      - "elastic_agent/**"
      - "tests/**"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/build-app.yaml"
  push:
    branches:
      - main
    paths:
      - "elastic_agent/**"
      - ".github/workflows/builder.yaml"
      - ".github/workflows/build-app.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build elastic_agent
    needs: smoke
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      app: elastic_agent
      publish: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  # Keeps GitHub releases in step with config.yaml: once a version's images are
  # published, tag the commit v<version> and release it with the version's
  # CHANGELOG.md section. Versions that already have a release are left alone.
  release:
    name: Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the tag and release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${tag} is already released."
            exit 0
          fi
          .github/scripts/release-notes "${VERSION}" > "${RUNNER_TEMP}/notes.md"
          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run the smoke test
        run: tests/smoke/smoke.sh
