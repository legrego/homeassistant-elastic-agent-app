# Standalone policy for the smoke test. It mirrors the Fleet policy suggested in
# elastic_agent/DOCS.md: one journald input for Core with multiline joining, and
# one for everything else.
outputs:
  default:
    type: elasticsearch
    hosts: ["http://elasticsearch:9200"]

agent:
  monitoring:
    enabled: false

inputs:
  - id: journald-haos-core
    type: journald
    use_output: default
    streams:
      - id: journald-haos-core
        data_stream:
          type: logs
          dataset: haos.core
          namespace: default
        seek: head
        include_matches:
          - CONTAINER_NAME=homeassistant
        parsers:
          - multiline:
              type: pattern
              pattern: '^(\x1b\[[0-9;]*m)?\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
              negate: true
              match: after

  - id: journald-haos-system
    type: journald
    use_output: default
    streams:
      - id: journald-haos-system
        data_stream:
          type: logs
          dataset: haos.system
          namespace: default
        seek: head
        processors:
          - drop_event:
              when:
                equals:
                  container.name: homeassistant
