# https://contributors.home-assistant.io/apps/reference/configuration/
name: Elastic Agent
version: "0.2.0"
slug: elastic_agent
description: >-
  Ship Home Assistant, Supervisor, app and host logs to Elasticsearch with
  Elastic Agent
url: "https://github.com/legrego/homeassistant-elastic-agent-app/tree/main/elastic_agent"
image: "ghcr.io/legrego/ha-app-elastic-agent"
arch:
  - aarch64
  - amd64
stage: experimental
# The Elastic Agent image ships its own init (tini).
init: false
# Agent needs a few seconds to flush queued events on shutdown.
timeout: 30
# Read-only access to the host's systemd journal (/var/log/journal, /run/log/journal).
# Every container on Home Assistant OS logs to journald, so this covers Core,
# the Supervisor, every app and the host. It doesn't change the security rating.
journald: true
# Default role only: used to read the host name from /host/info.
hassio_api: true
map:
  # For a CA certificate given as a file name.
  - type: ssl
backup_exclude:
  - "state/data/logs"
  - "state/data/logs/*"
  - "state/data/logs/default/*"
# Optional settings left out of options are hidden in the UI until the user
# shows unused optional options. The Fleet settings are hidden that way, so new
# users see the standalone settings first. url fields can't be empty, so
# elasticsearch_url is a str that the entrypoint checks.
options:
  elasticsearch_url: ""
  username: ""
  password: ""
  api_key: ""
  collect_core: true
  collect_supervisor: true
  collect_apps: true
  collect_host: true
  read_existing_logs: false
  insecure: false
  tags: []
schema:
  elasticsearch_url: str?
  username: str?
  password: password?
  api_key: password?
  collect_core: bool
  collect_supervisor: bool
  collect_apps: bool
  collect_host: bool
  read_existing_logs: bool
  ca_certificate: str?
  insecure: bool
  tags:
    - str?
  fleet_url: url?
  enrollment_token: password?
